<div class="{{ include.class | default: '' }}" style="text-align: {{ include.align | default: 'center' }};">
  {% if include.href %}
    <a href="{{ site.baseurl }}{{ include.href }}">
      <img src="{{ site.baseurl }}{{ include.url }}" width="{{ include.width }}" height="{{ include.height }}" alt="{{ include.alt | default: '' }}">
    </a>
  {% else %}
    <img src="{{ site.baseurl }}{{ include.url }}" width="{{ include.width }}" height="{{ include.height }}" alt="{{ include.alt | default: '' }}">
  {% endif %}
  {% if include.caption %}
    <div class="caption">{{ include.caption }}</div>
  {% endif %}
</div>

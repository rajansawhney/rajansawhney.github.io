  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const toggle = document.querySelector('.menu-toggle');
      const trigger = document.querySelector('.site-nav .trigger');
      const iconHamburger = toggle.querySelector('.icon-hamburger');
      const iconClose = toggle.querySelector('.icon-close');

      toggle.addEventListener('click', function (e) {
        e.preventDefault();
        trigger.classList.toggle('open');
        iconHamburger.style.display = trigger.classList.contains('open') ? 'none' : 'inline';
        iconClose.style.display = trigger.classList.contains('open') ? 'inline' : 'none';
      });

      // initialize icon state
      iconClose.style.display = 'none';
    });
  </script>
